# =====================================================================================
# AquaGrid — continuous integration
#
# The pipeline mirrors the supply-chain evidence the technology justification commits to:
# build → unit tests → integration tests (Testcontainers on real PostGIS) → dependency
# vulnerability scan → container image scan → SBOM. Government procurement requires this
# evidence; it is not optional decoration.
#
# The frontend runs in parallel: typecheck, lint, build, and a production artifact upload.
# =====================================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancels a superseded run on the same ref — a force-push or a second commit to a PR should not
# queue behind the build of the version it replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required for Trivy/SARIF upload to GitHub Security
  actions: read            # upload-sarif reads its own workflow run for context; without this
                            # it fails with "Resource not accessible by integration"

jobs:
  # ---- Backend: build + test -----------------------------------------------------------
  backend:
    name: Backend (build, test, scan)
    runs-on: ubuntu-latest
    # 25 was sized for compile+test+scan together, but the OWASP step alone can run long on a
    # cold NVD cache (see its own timeout below) — this budget has to cover that plus everything
    # after it (Trivy, SBOM, uploads), or a slow scan silently kills steps that already passed.
    timeout-minutes: 40
    env:
      # Testcontainers needs the Docker socket; the hosted runner provides it.
      TESTCONTAINERS_RYUK_DISABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile is a separate step so a compile failure is distinct from a test failure in the
      # check summary — the latter is actionable by the author, the former by whoever broke the build.
      - name: Compile
        working-directory: backend
        run: mvn -B -ntp clean compile

      - name: Unit tests
        working-directory: backend
        run: mvn -B -ntp test

      # Integration tests run against a real PostGIS via Testcontainers. Mocking a spatial database
      # tests nothing: ST_AsMVT, GiST indexes and tenant filters all behave materially differently
      # on H2. Docker must be available (it is, on the hosted runner).
      - name: Integration tests
        working-directory: backend
        run: mvn -B -ntp verify

      # Publishes the JUnit report as an annotation summary so a failing test surfaces on the PR
      # without opening the log.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'

      # Builds the layered production image. The build-arg is the context root so the Dockerfile's
      # relative COPY paths resolve.
      - name: Build image
        id: image
        run: |
          docker build -t aquagrid/api:ci -f backend/app-bootstrap/Dockerfile backend

      # ---- Supply-chain evidence -------------------------------------------------------
      # The local NVD mirror dependency-check downloads before it can scan anything. Cached and
      # keyed by week: a warm cache turns the update into a small incremental delta instead of a
      # ~377k-record cold pull, which is what took the unauthenticated (no NVD_API_KEY) job past
      # its old 25-minute budget on the very first run and killed every step after it — Trivy,
      # SBOM, the lot — none of which had actually failed.
      - name: Week number for the cache key
        id: dc-week
        run: echo "week=$(date +%Y-W%U)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP dependency-check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dc-data-${{ steps.dc-week.outputs.week }}
          restore-keys: owasp-dc-data-

      # OWASP dependency-check: CVE scan of the Maven dependency tree. Fails on high/critical
      # findings. The NVD API key raises the rate limit; without it the scan still runs but slower.
      # Its own timeout is well inside the job's, so a slow NVD update can never eat the budget
      # Trivy/SBOM/uploads need — continue-on-error was already meant to make this non-blocking;
      # this is what makes that true even when the step runs out of its own clock.
      - name: Dependency vulnerability scan
        working-directory: backend
        timeout-minutes: 15
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -DskipTests org.owasp:dependency-check-maven:check
          $( [ -n "$NVD_API_KEY" ] && echo "-DapiKey=$NVD_API_KEY" )
          -DfailBuildOnCVSS=7 -DsuppressionFiles=../.github/owasp-suppressions.xml || true
        continue-on-error: true   # Phase 7: report, do not block, until the baseline is triaged

      # Trivy scans the built image for OS-package and library CVEs. SARIF upload populates the
      # repo's Security tab so findings are tracked to closure.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aquagrid/api:ci
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'   # Phase 7: report. Promote to '1' once the baseline is triaged.

      - name: Upload Trivy results to Security tab
        if: always()
        continue-on-error: true   # Populating the Security tab needs GitHub Advanced
          # Security enabled on the repo; a scan that already ran and already printed its
          # findings in the step above should not be what blocks a release candidate.
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # SBOM in CycloneDX format — the artifact a customer's security team demands alongside the binary.
      - name: Generate SBOM
        working-directory: backend
        run: mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:makeBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: '**/target/*.bom.*'

  # ---- Frontend: typecheck + build ----------------------------------------------------
  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Typecheck is the contract gate: a backend field rename breaks the build here, not in prod.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: frontend/dist

  # ---- Deploy gate: only on main, only if both pass ----------------------------------
  # The deploy job is a gate, not an executor: it succeeds when both upstream jobs succeed,
  # signalling to the deploy pipeline (separate, environment-protected) that a candidate is ready.
  # Actual deployment runs in a protected environment with manual approval.
  ready:
    name: Release candidate ready
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: echo "Backend and frontend both green. Release candidate is ready for promotion."
