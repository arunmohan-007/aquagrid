# =====================================================================================
# AquaGrid — production deploy
#
# Fires when CI (build → test → integration test → scan) finishes successfully on `main`.
# Rebuilding the image here rather than reusing CI's `aquagrid/api:ci` is deliberate: this
# is the one build whose output is pushed anywhere, so it gets its own clean, reproducible
# build step instead of inheriting an artifact from a workflow that was scoped as "pass/fail
# gate", not "release candidate."
#
# No SSH key and no long-lived AWS access key ever touch this repo. GitHub's OIDC token lets
# the job assume a role scoped to this repo and this branch (see docs/deploy/aws-setup.md for
# the one-time IAM setup); the rollout itself runs over AWS Systems Manager, which needs no
# open inbound port on the EC2 host.
#
# One-time setup this workflow assumes — see docs/deploy/aws-setup.md:
#   - An IAM role named `github-actions-aquagrid-deploy`, trusted for OIDC from this repo.
#   - An ECR repository.
#   - An EC2 instance with the SSM agent running, docker + docker compose installed, this
#     repo's deploy/ directory present, and an instance profile that can pull from ECR.
#   - Four repository variables (Settings → Secrets and variables → Actions → Variables):
#     AWS_ACCOUNT_ID, AWS_REGION, ECR_REPOSITORY, EC2_INSTANCE_ID.
# =====================================================================================
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write   # required to mint the OIDC token configure-aws-credentials exchanges
  contents: read

# A deploy in flight is never cancelled by the next push landing mid-rollout — the next
# push's deploy queues behind it instead of racing it onto the same host.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push to ECR, roll out on EC2
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Pins the checkout to the exact commit CI just passed, not whatever HEAD is by the
      # time this job starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Temporary — prints what the OIDC token actually claims (sub/aud/ref/environment),
      # not the raw token. Two failed AssumeRoleWithWebIdentity attempts with a trust
      # policy that should match means the claim is not what's expected; read it instead
      # of guessing a third time. Remove once the mismatch is found.
      - name: Debug OIDC token claims
        run: |
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ "$MOD" -ne 0 ]; then
            PAD=$(( 4 - MOD ))
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          fi
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref, environment, job_workflow_ref, event_name}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-aquagrid-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -f backend/app-bootstrap/Dockerfile backend
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # No SSH. AWS-RunShellScript runs on the instance under SSM; the only thing that
      # crosses the network from this job is the command text and its result.
      - name: Roll out on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "AquaGrid deploy ${IMAGE_TAG:0:7}" \
            --parameters "{\"commands\":[
              \"set -euo pipefail\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}\",
              \"cd /home/ubuntu/aquagrid/deploy\",
              \"export ECR_REGISTRY=${REGISTRY} ECR_REPOSITORY=${ECR_REPOSITORY} IMAGE_TAG=${IMAGE_TAG}\",
              \"docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile web pull api\",
              \"docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile web up -d api\",
              \"sleep 15\",
              \"curl -fsS http://localhost:8080/actuator/health/readiness\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "SSM command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" --output text)

          echo "---- stdout ----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "---- stderr ----"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            echo "Rollout did not succeed on $EC2_INSTANCE_ID (status: $STATUS)."
            exit 1
          fi
