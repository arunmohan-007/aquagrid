# =====================================================================================
# AquaGrid — local development database
#
# One command brings up a PostgreSQL with every extension the platform needs:
# PostGIS (spatial), pgRouting (network tracing), TimescaleDB (telemetry hypertables).
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# The default postgis/postgis image lacks pgRouting and TimescaleDB, so this builds the custom
# aquagrid-db image (deploy/postgres/Dockerfile) the first time. The initdb script creates the
# extensions and sets sane defaults; Flyway then owns all schema creation on app startup.
#
# Connect:  jdbc:postgresql://localhost:5432/aquagrid  (user/pass: aquagrid/aquagrid)
# =====================================================================================
name: aquagrid-dev

services:
  postgres:
    build:
      context: ./postgres
    image: aquagrid-db:local
    container_name: aquagrid-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquagrid
      POSTGRES_USER: aquagrid
      POSTGRES_PASSWORD: aquagrid
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 on the host to avoid clashing with any locally-installed PostgreSQL on 5432.
      # Inside the container the DB still listens on 5432; only the host mapping differs.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquagrid -d aquagrid"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Object storage for attachments (Module 23). Optional — the app falls back to filesystem
  # storage if no S3-compatible backend is configured, but MinIO is the production-equivalent
  # path and worth running locally so uploads behave as they will in deployment.
  minio:
    image: minio/minio:latest
    container_name: aquagrid-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aquagrid
      MINIO_ROOT_PASSWORD: aquagrid-secret
    volumes:
      - minio-dev-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
  minio-dev-data:
