# =====================================================================================
# AquaGrid — single-node deployment
#
# Profiles keep the stack honest about what each module actually needs:
#   (default)   postgres + api          → Module 1
#   --profile web        + nginx + spa  → serves the SPA behind TLS termination
#   --profile gis        + geoserver    → Module 4
#   --profile iot        + mosquitto    → Module 18
#
# A municipality running Module 1 does not start a LoRaWAN network server.
# =====================================================================================

name: aquagrid

services:
  postgres:
    # Custom image: postgis/postgis base + pgRouting + TimescaleDB.
    # The default postgis image lacks both, and Modules 11/12 (tracing) + 13 (hypertables) need them.
    build:
      context: ./postgres
    image: aquagrid-db:latest
    container_name: aquagrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquagrid}
      POSTGRES_USER: ${POSTGRES_USER:-aquagrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Enforces scram-sha-256 for any new role rather than the weaker default.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only. Publishing 5432 on 0.0.0.0 exposes the database to the
      # internet on any host without a firewall — a mistake that is only ever noticed
      # after the fact.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquagrid} -d ${POSTGRES_DB:-aquagrid}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [aquagrid]

  api:
    build:
      context: ../backend
      dockerfile: app-bootstrap/Dockerfile
    container_name: aquagrid-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Production already has Flyway history entries numbered ahead of some migrations added
      # later in development (the IoT module's V140x range predates V1335 in application order
      # but not in version number) -- out-of-order lets a migration land in that gap instead of
      # failing validation on every startup.
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      POSTGRES_DB: ${POSTGRES_DB:-aquagrid}
      POSTGRES_USER: ${POSTGRES_USER:-aquagrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AQUAGRID_MASTER_KEY: ${AQUAGRID_MASTER_KEY:?AQUAGRID_MASTER_KEY must be set (openssl rand -base64 32)}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      AQUAGRID_BOOTSTRAP_ADMIN_EMAIL: ${AQUAGRID_BOOTSTRAP_ADMIN_EMAIL:-}
      AQUAGRID_BOOTSTRAP_ADMIN_PASSWORD: ${AQUAGRID_BOOTSTRAP_ADMIN_PASSWORD:-}
      # ---- HTTP device receiver (POST /api/v1/receiver/http) --------------------------------
      IOT_HTTP_ENABLED: ${IOT_HTTP_ENABLED:-true}
      IOT_RECEIVER_ENABLED: ${IOT_RECEIVER_ENABLED:-true}
      IOT_SIMULATOR_ENABLED: ${IOT_SIMULATOR_ENABLED:-false}
      IOT_LEGACY_HTTP_INGEST_ENABLED: ${IOT_LEGACY_HTTP_INGEST_ENABLED:-false}
      RECEIVER_REQUIRE_AUTH: ${RECEIVER_REQUIRE_AUTH:-true}
      RECEIVER_IP_ALLOW_LIST: ${RECEIVER_IP_ALLOW_LIST:-}
      # SHA-256 hex of the gateway API key (printf '%s' 'key' | sha256sum). Plaintext never here.
      RECEIVER_GATEWAY_PRINCIPAL: ${RECEIVER_GATEWAY_PRINCIPAL:-gateway}
      RECEIVER_GATEWAY_API_KEY_SHA256: ${RECEIVER_GATEWAY_API_KEY_SHA256:-}
      RECEIVER_MAX_PACKET_BYTES: ${RECEIVER_MAX_PACKET_BYTES:-65536}
      RECEIVER_PPM_DEVICE: ${RECEIVER_PPM_DEVICE:-120}
      RECEIVER_PPM_SOURCE: ${RECEIVER_PPM_SOURCE:-30000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - attachments-data:/app/data/attachments
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [aquagrid]

  nginx:
    profiles: [web]
    image: nginx:1.27-alpine
    container_name: aquagrid-nginx
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_common.conf:/etc/nginx/conf.d/proxy_common.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - spa-dist:/usr/share/nginx/html:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [aquagrid]

  spa-build:
    profiles: [web]
    image: node:22-alpine
    container_name: aquagrid-spa-build
    working_dir: /app
    volumes:
      - ../frontend:/app
      - spa-dist:/app/dist
    command: sh -c "npm ci && npm run build"
    networks: [aquagrid]

  geoserver:
    profiles: [gis]
    image: docker.osgeo.org/geoserver:2.26.0
    container_name: aquagrid-geoserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set}
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "vectortiles,ysld,importer"
    volumes:
      - geoserver-data:/opt/geoserver_data
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8081}:8080"
    networks: [aquagrid]

  mosquitto:
    profiles: [iot]
    image: eclipse-mosquitto:2.0
    container_name: aquagrid-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_TLS_PORT:-8883}:8883"
    networks: [aquagrid]

volumes:
  postgres-data:
  attachments-data:
  geoserver-data:
  mosquitto-data:
  spa-dist:

networks:
  aquagrid:
    driver: bridge
