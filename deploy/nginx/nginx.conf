# =====================================================================================
# AquaGrid edge configuration
#
# Terminates TLS, serves the SPA, and proxies the API. The X-Forwarded-For chain set here
# is what the backend's ClientIpResolver reads — the backend trusts it only because this
# container's subnet is listed in TRUSTED_PROXIES, and it still walks the chain
# right-to-left rather than believing the leftmost value.
# =====================================================================================

# Edge rate limiting, in front of the application's own controls. Defence in depth: this
# sheds obvious floods before they reach a BCrypt comparison, which is deliberately
# expensive and therefore a CPU amplifier if left unthrottled.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
# Device telemetry: one gateway fronts thousands of meters. Higher than the console API zone,
# still bounded — the application also enforces RECEIVER_PPM_SOURCE / RECEIVER_PPM_DEVICE.
limit_req_zone $binary_remote_addr zone=receiver_zone:10m rate=2000r/m;

server {
    listen 80;
    server_name aquagrid.duckdns.org;
    # Everything is HTTPS. The refresh cookie is Secure, so plain HTTP cannot work anyway.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aquagrid.duckdns.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # 'unsafe-inline' for styles is required by Emotion (MUI); scripts are not exempted.
    #
    # No third-party tile origins are listed any more: base map tiles and place search are proxied
    # through the /basemap/ and /geocode/ locations below, so every request the browser makes is
    # same-origin. That both tightens this policy and survives networks that filter third-party
    # requests.
    #
    # worker-src blob: is REQUIRED by MapLibre — it compiles its tile workers from blob URLs.
    # Without it the map silently fails to render, because a blocked worker is not an error the
    # library reports. That omission would have broken the deployed map even once the tiles
    # themselves were reachable.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/geo+json
               application/javascript text/css text/plain image/svg+xml
               application/vnd.mapbox-vector-tile;

    # ---- SPA -------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # MapLibre ships its tile-decoding worker as an ES module (.mjs) and browsers enforce a
    # strict JavaScript Content-Type on module scripts — unlike a classic <script>, a wrong
    # MIME type is a hard refusal to execute, not a warning. nginx's bundled mime.types has no
    # .mjs entry, so without this the worker falls back to `default_type` (application/octet-
    # stream), fails to load, and never spawns. That failure is invisible on the map itself:
    # raster base-map tiles are plain images and need no worker, so they render normally while
    # every vector layer — the pipe network among them — is fetched but never decoded, with no
    # error anywhere in the UI. A regex location takes precedence over the /assets/ prefix
    # location above regardless of declaration order, so this reaches the worker file however
    # its hashed name changes across builds.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current asset hashes, and
    # a stale copy pins users to a deleted build after every deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- API -------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # Canonical device ingress. Separate from the console /api/ zone so a busy gateway is not
    # throttled by interactive UI traffic, and so packet bodies cannot be the 60m GIS upload size.
    # CORS is irrelevant here: meters are not browsers. Authentication is the receiver pipeline
    # (X-API-Key / X-Device-Token / HMAC), not a user JWT.
    location /api/v1/receiver/ {
        limit_req zone=receiver_zone burst=500 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    location /.well-known/ {
        proxy_pass http://api:8080;
        include /etc/nginx/conf.d/proxy_common.conf;
    }

    # ---- Base map tiles -------------------------------------------------------------------
    # Proxied so the browser only ever talks to this origin. Mirrors the /basemap/* rules in
    # frontend/vite.config.ts; the two must be changed together or dev and production diverge.
    #
    # A resolver is required because these upstreams are named hosts resolved at request time
    # rather than at config load. It is shared by the /geocode/ block below.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    location /basemap/osm/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_set_header Host tile.openstreetmap.org;
        # OSM's tile usage policy requires an identifying User-Agent. A browser will not let us
        # set one; a proxy will.
        proxy_set_header User-Agent "AquaGrid/1.0 (water utility GIS; self-hosted)";
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /basemap/esri-imagery/ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/;
        proxy_set_header Host server.arcgisonline.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Label glyphs for the symbol layers Layer Style Management can switch on. MapLibre's own font
    # endpoint — no API key. Proxied like the tiles, and additionally because the CSP above is
    # connect-src 'self': a direct request to demotiles.maplibre.org would be blocked here while
    # working perfectly in development. Mirrors the /basemap/fonts rule in frontend/vite.config.ts.
    #
    # Cached for a year rather than seven days: a glyph range for a fixed font stack is immutable,
    # and the map requests several ranges on the first label it draws.
    location /basemap/fonts/ {
        proxy_pass https://demotiles.maplibre.org/font/;
        proxy_set_header Host demotiles.maplibre.org;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /basemap/esri-reference/ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/;
        proxy_set_header Host server.arcgisonline.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Place search (Nominatim) ---------------------------------------------------------
    # Forward geocoding for the map search box. Proxied for the same reasons as the tiles, and to
    # attach the User-Agent Nominatim's usage policy requires. Responses are not cached: search
    # terms are too varied for a cache to help and freshness matters for addressing.
    location /geocode/ {
        proxy_pass https://nominatim.openstreetmap.org/;
        proxy_set_header Host nominatim.openstreetmap.org;
        proxy_set_header User-Agent "AquaGrid/1.0 (water utility GIS; self-hosted)";
        proxy_ssl_server_name on;
    }

    # Actuator is never reachable from the internet; scrape it on the internal network.
    location /actuator/ {
        deny all;
        return 404;
    }
}
