# Shared proxy headers.
#
# `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for` APPENDS the real peer to
# any inbound value rather than replacing it. That is intentional and is what makes the
# backend's right-to-left traversal correct: anything a client forged sits to the left of
# the address nginx just appended, and is therefore never reached.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Required for the WebSocket push used by the live dashboard from Module 13 onwards.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering       on;
proxy_buffer_size     16k;
proxy_buffers         8 16k;
